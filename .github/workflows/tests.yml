name: Tests and package smoke

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate dependencies
        run: python -m pip check
      - name: Compile
        run: |
          python -m py_compile app.py automate.py tools/make_release.py tools/sign_release.py tools/workbench_qa.py tools/phase1_qa.py tools/phase2_qa.py tools/phase3_qa.py tools/system_qa.py tools/editor_live_smoke.py tools/editor_portable_smoke.py
          python -m compileall -q vietsub
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Check frontend syntax
        run: |
          node --check static/app.js
          node --check static/workbench.js
          node --check static/editor.js
          node --check static/uploader.js
          node --check static/sakuga-vfx.js
      - name: Run frontend tests
        run: node --test tests/*.js tests/frontend/*.test.mjs

  desktop-ui:
    needs: unit-tests
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64
          cache: pip
      - name: Install UI test dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m playwright install chromium
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) { choco install ffmpeg --yes --no-progress }
      - name: Exercise desktop layouts, crop and keyboard interaction
        run: python tools/workbench_qa.py --output workbench-qa
      - name: Exercise Creator Workbench handoff and cleanup
        run: python tools/phase1_qa.py --output phase1-qa
      - name: Exercise Auto Edit render and synthetic TTS alignment
        run: python tools/phase2_qa.py --output phase2-qa
      - name: Exercise Publish Hub profiles, scheduling and isolation
        run: python tools/phase3_qa.py --output phase3-qa
      - name: Exercise speed, pitch and experimental CapCut Draft export
        run: python tools/system_qa.py --output system-qa
      - name: Exercise v2.0.3 real DOM regression checks
        env:
          VIETSUB_REQUIRE_BROWSER_TESTS: "1"
        run: python -m unittest discover -s tests -p test_v203_dom_playwright.py -v
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: VietSub-Studio-workbench-qa-${{ github.sha }}
          path: |
            workbench-qa/*
            phase1-qa/*
            phase2-qa/*
            phase3-qa/*
            system-qa/*
          if-no-files-found: warn

  landing-page:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: landing-page
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: landing-page/package-lock.json
      - name: Install landing dependencies
        run: npm ci
      - name: Lint landing page without warnings
        run: npm run lint
      - name: Type-check landing page
        run: npm run typecheck
      - name: Build landing page
        run: npm run build

  package-smoke:
    needs: [unit-tests, desktop-ui, landing-page]
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64
          cache: pip
      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Build portable executable
        run: python -m PyInstaller --noconfirm --clean --distpath dist_portable --workpath build_portable "VietSub Studio Portable.spec"
      - name: Generate build manifest and dependency inventory
        shell: pwsh
        run: |
          python -m pip freeze | Out-File -Encoding utf8 "dist_portable\dependencies.txt"
          $exe = Resolve-Path "dist_portable\VietSub Studio.exe"
          $manifest = [ordered]@{
            commit = "${{ github.sha }}"
            ref = "${{ github.ref }}"
            python = (python --version)
            architecture = "x64"
            artifact = $exe.Path
            sha256 = (Get-FileHash -Algorithm SHA256 $exe).Hash.ToLowerInvariant()
          }
          $manifest | ConvertTo-Json | Out-File -Encoding utf8 "dist_portable\build-manifest.json"
      - name: Smoke-test packaged local server
        shell: pwsh
        run: |
          $exe = (Resolve-Path "dist_portable\VietSub Studio.exe").Path
          $smokeConfigDir = Join-Path $env:RUNNER_TEMP "vietsub-package-smoke-config"
          if (Test-Path $smokeConfigDir) { Remove-Item -Recurse -Force $smokeConfigDir }
          New-Item -ItemType Directory -Path $smokeConfigDir -Force | Out-Null
          $env:VIETSUB_STUDIO_CONFIG_DIR = $smokeConfigDir

          # 1. Verify bundled Cryptodome Ed25519 native extensions & RFC 8032 verification inside the frozen GUI EXE.
          $cryptoOutFile = Join-Path $env:RUNNER_TEMP "vietsub-crypto-selfcheck.txt"
          if (Test-Path $cryptoOutFile) { Remove-Item -Force $cryptoOutFile }
          $cryptoProc = Start-Process -FilePath $exe -ArgumentList @("--self-check-crypto", $cryptoOutFile) -PassThru
          if (-not $cryptoProc.WaitForExit(60000)) {
            Stop-Process -Id $cryptoProc.Id -Force -ErrorAction SilentlyContinue
            throw "Packaged Ed25519 self-check timed out after 60 seconds."
          }
          $cryptoText = if (Test-Path $cryptoOutFile) { (Get-Content -Raw -Path $cryptoOutFile).Trim() } else { "" }
          if ($cryptoProc.ExitCode -ne 0 -or $cryptoText -notmatch "Ed25519 RFC 8032 OK") {
            throw "Packaged Ed25519 self-check failed (exit $($cryptoProc.ExitCode)): $cryptoText"
          }
          Remove-Item -Force $cryptoOutFile -ErrorAction SilentlyContinue
          Write-Host "PASS [1/6] --self-check-crypto: $cryptoText (exit 0)"

          $process = Start-Process -FilePath $exe -ArgumentList "--server" -PassThru
          try {
            $ready = $false
            for ($attempt = 0; $attempt -lt 60; $attempt++) {
              try {
                $response = Invoke-WebRequest -UseBasicParsing -Uri "http://127.0.0.1:5000/" -TimeoutSec 2
                if ($response.StatusCode -eq 200 -and $response.Content -match "VietSub Studio") {
                  $ready = $true
                  break
                }
              } catch {}
              Start-Sleep -Seconds 1
            }
            if (-not $ready) {
              throw "Packaged app did not become ready within 60 seconds."
            }
            foreach ($asset in @("avatar.jpg", "static/app.js", "static/editor.js", "static/uploader.js", "static/editor-THIRD-PARTY.txt", "static/uploader-THIRD-PARTY.txt", "static/style.css", "static/motion.css", "static/workbench.js", "static/sakuga-vfx.js", "static/fonts.css", "static/sakuga-LICENSE.txt", "static/fonts/be-vietnam-pro-regular.ttf", "static/fonts/be-vietnam-pro-medium.ttf", "static/fonts/be-vietnam-pro-semibold.ttf", "static/fonts/be-vietnam-pro-bold.ttf", "static/fonts/noto-sans-sc.ttf", "static/fonts/jetbrains-mono.ttf", "static/fonts/be-vietnam-pro-OFL.txt", "static/fonts/noto-sans-sc-OFL.txt", "static/fonts/jetbrains-mono-OFL.txt")) {
              $assetResponse = Invoke-WebRequest -UseBasicParsing -Uri "http://127.0.0.1:5000/$asset" -TimeoutSec 5
              if ($assetResponse.StatusCode -ne 200) {
                throw "Packaged asset $asset was not served correctly."
              }
            }
            $token = [regex]::Match($response.Content, 'name="api-token" content="([^"]+)"').Groups[1].Value
            if (-not $token) { throw "Missing api-token meta in packaged index page." }
            $authHeaders = @{ "X-VietSub-Token" = $token }

            # 2. Verify yt-dlp and yt-dlp-ejs lazy imports.
            $health = Invoke-RestMethod -Uri "http://127.0.0.1:5000/api/health" -Headers $authHeaders -TimeoutSec 30
            if (-not $health.checks.ytdlp.ok) {
              throw "yt-dlp is missing from the packaged executable: $($health.checks.ytdlp.detail)"
            }
            if ($health.checks.js_runtime.detail -match "yt-dlp-ejs") {
              throw "yt-dlp-ejs is missing from the packaged executable."
            }
            Write-Host "PASS [2/6] /api/health: yt-dlp + yt-dlp-ejs OK"

            # 3. Verify Publish Hub bundled selectors.json + YouTube API lazy imports (requests/certifi).
            $upCaps = Invoke-RestMethod -Uri "http://127.0.0.1:5000/api/uploader/capabilities" -Headers $authHeaders -TimeoutSec 15
            if ($upCaps.default_upload_mode -ne "assisted" -or -not $upCaps.youtube_api_supported -or $upCaps.platforms.Count -lt 6) {
              throw "Packaged /api/uploader/capabilities invalid: $($upCaps | ConvertTo-Json -Compress)"
            }
            if ($upCaps.selector_override.warning) {
              throw "Packaged selectors.json reported warning: $($upCaps.selector_override.warning)"
            }
            $ytProf = Invoke-RestMethod -Method Post -Uri "http://127.0.0.1:5000/api/uploader/profiles" -Headers $authHeaders -ContentType "application/json" -Body '{"platform":"youtube","name":"Smoke YT"}' -TimeoutSec 15
            if (-not $ytProf.id -or $null -eq $ytProf.youtube_api) {
              throw "Packaged YouTube profile creation failed to load youtube_api module."
            }
            Write-Host "PASS [3/6] /api/uploader/capabilities (platforms=$($upCaps.platforms.Count), default=$($upCaps.default_upload_mode)) + YouTube profile OK"

            # 4. Verify Phase 1 / 3.1 / 3.2 endpoints: glossaries, channel-presets, editor capabilities, update.
            $glossaries = Invoke-RestMethod -Uri "http://127.0.0.1:5000/api/glossaries" -Headers $authHeaders -TimeoutSec 15
            if ($glossaries.active_id -ne "default") { throw "Packaged /api/glossaries failed." }
            $presets = Invoke-RestMethod -Uri "http://127.0.0.1:5000/api/channel-presets" -Headers $authHeaders -TimeoutSec 15
            if ($null -eq $presets.presets) { throw "Packaged /api/channel-presets failed." }
            $edCaps = Invoke-RestMethod -Uri "http://127.0.0.1:5000/api/editor/capabilities" -Headers $authHeaders -TimeoutSec 15
            if ($edCaps.subtitle_animations -notcontains "word_pop") { throw "Packaged /api/editor/capabilities missing word_pop." }
            $upd = Invoke-RestMethod -Uri "http://127.0.0.1:5000/api/update" -Headers $authHeaders -TimeoutSec 20
            if ($null -eq $upd.current_version) { throw "Packaged /api/update failed." }
            Write-Host "PASS [4/6] /api/glossaries + /api/channel-presets + /api/editor/capabilities + /api/update (v$($upd.current_version), auto=$($upd.automatic_update_supported)) OK"

            # 5. Negative security boundary checks (TESTING=False): missing token -> 403, foreign Origin -> 403, non-JSON -> 415.
            foreach ($neg in @(
              @{ Name = "Missing token"; Method = "Get"; Uri = "http://127.0.0.1:5000/api/channel-presets"; Headers = @{}; Body = $null; ContentType = $null; Expected = 403 },
              @{ Name = "Foreign origin"; Method = "Post"; Uri = "http://127.0.0.1:5000/api/glossaries"; Headers = @{ "X-VietSub-Token" = $token; "Origin" = "https://evil.example" }; Body = '{"name":"Evil"}'; ContentType = "application/json"; Expected = 403 },
              @{ Name = "Non-JSON body"; Method = "Post"; Uri = "http://127.0.0.1:5000/api/glossaries"; Headers = $authHeaders; Body = "plain"; ContentType = "text/plain"; Expected = 415 },
              @{ Name = "Delete finished without token"; Method = "Delete"; Uri = "http://127.0.0.1:5000/api/uploader/queue/finished"; Headers = @{}; Body = "{}"; ContentType = "application/json"; Expected = 403 }
            )) {
              $code = 0
              try {
                $params = @{ UseBasicParsing = $true; Method = $neg.Method; Uri = $neg.Uri; Headers = $neg.Headers; TimeoutSec = 10 }
                if ($null -ne $neg.Body) { $params.Body = $neg.Body }
                if ($null -ne $neg.ContentType) { $params.ContentType = $neg.ContentType }
                $r = Invoke-WebRequest @params
                $code = [int]$r.StatusCode
              } catch {
                if ($_.Exception.Response) { $code = [int]$_.Exception.Response.StatusCode }
              }
              if ($code -ne $neg.Expected) {
                throw "Security check '$($neg.Name)' expected HTTP $($neg.Expected), got $code."
              }
              Write-Host "PASS [5/6] Security check '$($neg.Name)' -> HTTP $code"
            }

            $second = Start-Process -FilePath $exe -ArgumentList "--server" -PassThru
            if (-not $second.WaitForExit(60000)) {
              throw "A second packaged instance did not exit within 60 seconds."
            }
            if ($second.ExitCode -ne 2) {
              throw "A second packaged instance returned unexpected code $($second.ExitCode)."
            }
            Write-Host "PASS [6/6] Duplicate instance exit code = 2"
          } finally {
            $testProcesses = Get-CimInstance Win32_Process -Filter "Name='VietSub Studio.exe'" |
              Where-Object { $_.ExecutablePath -eq $exe }
            foreach ($testProcess in $testProcesses) {
              Stop-Process -Id $testProcess.ProcessId -Force
            }
            if (Test-Path $smokeConfigDir) { Remove-Item -Recurse -Force $smokeConfigDir -ErrorAction SilentlyContinue }
          }
      - name: Package release assets in the updater format
        id: release
        shell: pwsh
        run: |
          python tools/make_release.py --exe "dist_portable/VietSub Studio.exe" --output release --clean
          $version = python -c "import app; print(app.APP_VERSION)"
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - name: Verify release assets against the updater contract
        env:
          RELEASE_DIR: release
        run: python -m unittest discover -s tests -p test_release_contract.py -v
      - uses: actions/upload-artifact@v4
        with:
          name: VietSub-Studio-Portable-v${{ steps.release.outputs.version }}-release-assets
          path: release/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: VietSub-Studio-build-info-${{ github.sha }}
          path: |
            dist_portable/build-manifest.json
            dist_portable/dependencies.txt
          if-no-files-found: error
